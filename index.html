<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>口座開設完全ガイド</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      flex: 0 0 auto;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
    }

    .viewer {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: none;
      background: #fff;
    }

    .footer {
      flex: 0 0 auto;
      padding: 10px 12px;
      background: #111;
      text-align: center;
    }

    .open-button {
      display: inline-block;
      width: 100%;
      max-width: 500px;
      padding: 14px 20px;
      border-radius: 8px;
      background: #ef6c00;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .open-button:active {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      口座開設完全ガイド
    </div>

    <iframe
      class="viewer"
      src="account-guide.pdf#view=FitH"
      title="口座開設完全ガイド">
    </iframe>

    <div class="footer">
      <a
        class="open-button"
        href="account-guide.pdf"
        target="_blank"
        rel="noopener">
        PDFを全画面で開く
      </a>
    </div>

  </div>

</body>
</html>
